<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOPOGEN-PQ MESH-FDM-FEA — Structural Foundry</title>
    <link rel="icon" href="data:,">

    <!-- UI Styling (Tailwind Utility Classes + Modular Student Theme CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./ui/styles/workbench.css">

    <!-- Rhino3dm WebAssembly -->
    <script src="https://cdn.jsdelivr.net/npm/rhino3dm@8.4.0/rhino3dm.min.js"></script>

    <!-- Three.js (ES Module Map — Zero Build Step Required) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="h-screen w-screen overflow-hidden antialiased relative goldilocks-h1">

    <!-- =====================================================================
         1. LEFT ALGORITHMIC WORKBENCH PANEL (6-Tab + 3-Button Compact Mode)
         See STUDENT_GUIDE.md: each tab's controls & logic live in ui/tabs/*
         ===================================================================== -->
    <aside id="left-sidebar" class="floating-panel floating-sidebar">
        <!-- Draggable Title Bar with Goldilocks H1/H2/H3, Compact/Full Toggle & Minimize -->
        <div id="sidebar-drag-header" class="panel-header" title="Drag to reposition panel">
            <div class="panel-title-group">
                <span class="panel-grip">⠿</span>
                <h1 class="panel-title">TOPOGEN · PQ MESH · FDM · FEA</h1>
                <span id="build-tag" class="panel-tag text-cyan-600">FOUNDRY</span>
            </div>
            <div class="panel-actions">
                <span id="btn-goldilocks-help" class="panel-btn cursor-help" data-tip="Pipeline Overview — Tile growth, funicular form-finding, planar quad tubes, frame check." title="Pipeline Overview — Tile growth, funicular form-finding, planar quad tubes, frame check.">?</span>
                <button id="btn-sidebar-compact-toggle" class="panel-btn" title="Switch between 3-Button Compact Card and Full 6-Tab UI">Compact</button>
                <button id="btn-sidebar-minimize" class="panel-btn panel-toggle-btn" title="Minimize / Expand Panel">–</button>
            </div>
        </div>

        <!-- Summarized Pipeline Compact Card View (1-2. TOPOGEN, 3. PQ Mesh, 4. FDM, 5. FEA, 6. I/O) -->
        <div id="sidebar-compact-card" class="hidden p-2.5 space-y-1.5 border-b border-gray-800 bg-gray-900/95">
            <div class="space-y-1.5">
                <!-- 1-2. TOPOGEN: Algorithm, Grid & Run -->
                <div class="relative">
                    <button id="btn-compact-choose-algo" class="cad-btn cyan w-full py-1.5 px-2.5 flex items-center justify-between text-[10px]">
                        <span>1. TOPOGEN · Grid</span>
                        <span id="compact-algo-label" class="font-mono text-[9.5px] text-white bg-cyan-950/80 border border-cyan-500/40 rounded px-1.5 py-0.5">Topo · 3×3×4 ▾</span>
                    </button>
                    <div id="compact-algo-menu" class="hidden mt-1.5 p-2 bg-gray-950/95 border border-gray-700 rounded space-y-1.5">
                        <div class="flex items-center justify-between text-[9.5px] pb-1 border-b border-gray-800">
                            <span class="text-gray-400 font-semibold uppercase">Step 1 · Tiles &amp; Preset</span>
                            <button id="btn-compact-open-tiles" class="text-pink-400 hover:text-pink-300 underline font-mono">Open 1. Tiles ▸</button>
                        </div>
                        <div class="grid grid-cols-3 gap-1">
                            <button data-tile-preset="pilot_champion"     class="tile-preset-btn cad-btn seg-on text-[9px] py-0.5">★ Champion</button>
                            <button data-tile-preset="catenary_quadripod" class="tile-preset-btn cad-btn text-[9px] py-0.5">Catenary</button>
                            <button data-tile-preset="funicular_vault"    class="tile-preset-btn cad-btn text-[9px] py-0.5">Vault</button>
                        </div>
                        <div class="grid grid-cols-2 gap-1 pt-0.5">
                            <button data-algo="growth" class="algo-btn cad-btn text-[9.5px] py-1">(a) Adj Growth</button>
                            <button data-algo="wfc"    class="algo-btn cad-btn on text-[9.5px] py-1">(b) Topo Collapse</button>
                        </div>
                        <div class="grid grid-cols-5 gap-1">
                            <button data-rx="3"  data-ry="3"  data-rz="4"  class="res-preset-btn cad-btn seg-on text-[9px] py-0.5">3×3×4</button>
                            <button data-rx="4"  data-ry="3"  data-rz="1"  class="res-preset-btn cad-btn text-[9px] py-0.5">4×3×1</button>
                            <button data-rx="4"  data-ry="4"  data-rz="8"  class="res-preset-btn cad-btn text-[9px] py-0.5">4×4×8</button>
                            <button data-rx="5"  data-ry="5"  data-rz="5"  class="res-preset-btn cad-btn text-[9px] py-0.5">5×5×5</button>
                            <button data-rx="10" data-ry="10" data-rz="10" class="res-preset-btn cad-btn text-[9px] py-0.5">10³</button>
                        </div>
                    </div>
                </div>

                <div class="flex space-x-1">
                    <button id="btn-compact-run" class="cad-btn flex-1 py-1.5 px-2.5 flex items-center justify-between text-[10px]" title="Run or pause Topo Gen / Growth propagation">
                        <span id="compact-run-text">2. ▶ Run</span>
                        <span id="compact-progress-badge" class="font-mono text-[9px] bg-pink-950/70 border border-white/25 rounded px-1.5 py-0.5">36 / 36</span>
                    </button>
                    <button id="btn-compact-step" class="cad-btn py-1.5 px-2 text-[10px]" title="Step 1 iteration">⏭</button>
                    <button id="btn-compact-burst" class="cad-btn py-1.5 px-2 text-[10px]" title="Step 50 iterations">⚡×50</button>
                </div>

                <!-- 3. PQ MESH: Solidify All-Quad & 3D Unroll + Inline Tube Radius -->
                <div class="flex space-x-1 items-stretch">
                    <div class="flex-1 min-w-0 flex items-center gap-1.5 px-2 py-1 rounded border border-gray-700 bg-white">
                        <button id="btn-compact-pqm" class="flex items-center gap-1 text-[10px] font-semibold uppercase tracking-wide text-gray-100 hover:text-cyan-400 shrink-0 cursor-pointer" title="Solidify active network into watertight all-quad PQ tubular mesh">
                            <span>3. PQ Mesh</span>
                            <span id="compact-pqm-badge" class="font-mono text-[8.5px] bg-pink-950/50 border border-pink-500/30 rounded px-1 py-0.5">Build</span>
                        </button>
                        <div class="flex-1 min-w-0 flex items-center gap-1 pl-1 border-l border-gray-700">
                            <span class="font-mono font-semibold text-[9.5px] text-gray-300 shrink-0" title="Tube outer radius (m)">R</span>
                            <input id="rng-compact-tube-radius" type="range" min="0.040" max="0.200" step="0.001" value="0.060" class="flex-1 min-w-[44px] h-1.5 cursor-pointer" title="Tube outer radius (m)">
                            <span id="val-compact-tube-radius" class="font-mono text-[8.5px] text-gray-300 w-9 text-right shrink-0">0.060m</span>
                        </div>
                    </div>
                    <button id="btn-compact-unroll" class="cad-btn py-1.5 px-2 text-[9px] shrink-0" title="Toggle 3D Unrolled PQ Strips grid">Unroll</button>
                </div>

                <!-- 4. ELASTICA: A* V1-V1 Rods & Unroll -->
                <div class="flex space-x-1">
                    <button id="btn-compact-elastica" class="cad-btn accent flex-1 py-1.5 px-2.5 flex items-center justify-between text-[10px]" title="Trace A* V1→V1 paths, optimize elastica curves & build 3D rods">
                        <span>4. Elastica · Rods</span>
                        <span id="compact-elastica-badge" class="font-mono text-[9px] text-pink-300 bg-pink-950/50 border border-pink-500/30 rounded px-1.5 py-0.5">Build</span>
                    </button>
                    <button id="btn-compact-elastica-unroll" class="cad-btn py-1.5 px-2 text-[9px]" title="Toggle 3D Unrolled Elastica Rods">Unroll</button>
                </div>

                <!-- 5. FDM: Form-Finding -->
                <div class="flex space-x-1">
                    <button id="btn-compact-fdm" class="cad-btn cyan flex-1 py-1.5 px-2.5 flex items-center justify-between text-[10px]" title="Run Force Density Method (FDM) funicular form-finding on active network">
                        <span>5. FDM · Form-Find</span>
                        <span id="compact-fdm-badge" class="font-mono text-[9px] text-cyan-300 bg-cyan-950/50 border border-cyan-500/30 rounded px-1.5 py-0.5">Off</span>
                    </button>
                    <button id="btn-compact-fdm-reset" class="cad-btn py-1.5 px-2 text-[9px]" title="Reset FDM back to undeformed host topology">↺</button>
                </div>

                <!-- 6. FEA: 3D Structural Check -->
                <div class="flex space-x-1">
                    <button id="btn-compact-fea" class="cad-btn flex-1 py-1.5 px-2.5 flex items-center justify-between text-[10px]" title="Run 3D Euler-Bernoulli Space-Frame FEA check">
                        <span>6. FEA · Analyze</span>
                        <span id="compact-fea-badge" class="font-mono text-[9px] text-gray-300 bg-gray-900/60 border border-gray-700 rounded px-1.5 py-0.5">Ready</span>
                    </button>
                    <button id="btn-compact-fea-anim" class="cad-btn py-1.5 px-2 text-[9px]" title="Animate FEA Deflection">▶</button>
                </div>

                <!-- 7. I/O: Composite Multi-Layer Rhino .3dm Export -->
                <button id="btn-compact-export-3dm" class="cad-btn accent w-full py-1.5 px-2.5 flex items-center justify-between text-[10px]" title="Composite Rhino Export — Save tiles, centerlines, planar quad mesh, and flat sheets.">
                    <span>7. I/O · Export Composite .3dm</span>
                    <span id="compact-graph-badge" class="font-mono text-[9px] text-pink-200 bg-pink-950/60 border border-pink-500/35 rounded px-1.5 py-0.5">0V · 0E</span>
                </button>
            </div>

            <div class="pt-1 border-t border-gray-800 flex items-center justify-between text-[9.5px] text-gray-400">
                <div class="flex items-center space-x-2.5">
                    <button id="btn-compact-reset" class="hover:text-white underline font-mono" title="Reset voxel grid and restart propagation">↺ Reset</button>
                    <button id="btn-compact-toggle-graph" class="text-red-400 hover:text-red-300 underline font-mono" title="Toggle centerline graph visibility">Graph: ON</button>
                </div>
                <button id="btn-compact-expand-full" class="text-cyan-400 hover:text-cyan-300 font-semibold">Expand Full UI ▸</button>
            </div>
        </div>

        <!-- Full 6-Tab Algorithmic UI Wrapper (Mounted dynamically from ui/tabs/tab1..tab6) -->
        <div id="sidebar-collapsible" class="flex flex-col flex-1 min-h-0">
            <div class="flex border-b border-gray-800 bg-gray-900/95 text-[8.5px] font-bold tracking-tight uppercase select-none flex-none">
                <button data-tab="tab-tiles" class="ui-tab flex-1 py-2 px-0.5 text-center border-b-2 border-pink-500 text-white bg-gray-800/70 transition-colors whitespace-nowrap">1. Tiles</button>
                <button data-tab="tab-topo"  class="ui-tab flex-1 py-2 px-0.5 text-center border-b-2 border-transparent text-gray-400 hover:text-gray-200 transition-colors whitespace-nowrap">2. Topo</button>
                <button data-tab="tab-pq"       class="ui-tab flex-1 py-2 px-0.5 text-center border-b-2 border-transparent text-gray-400 hover:text-gray-200 transition-colors whitespace-nowrap">3. PQ Mesh</button>
                <button data-tab="tab-elastica" class="ui-tab flex-1 py-2 px-0.5 text-center border-b-2 border-transparent text-gray-400 hover:text-gray-200 transition-colors whitespace-nowrap">4. Elastica</button>
                <button data-tab="tab-fdm"      class="ui-tab flex-1 py-2 px-0.5 text-center border-b-2 border-transparent text-gray-400 hover:text-gray-200 transition-colors whitespace-nowrap">5. FDM</button>
                <button data-tab="tab-fea"      class="ui-tab flex-1 py-2 px-0.5 text-center border-b-2 border-transparent text-gray-400 hover:text-gray-200 transition-colors whitespace-nowrap">6. FEA</button>
                <button data-tab="tab-io"       class="ui-tab flex-1 py-2 px-0.5 text-center border-b-2 border-transparent text-gray-400 hover:text-gray-200 transition-colors whitespace-nowrap">7. I/O</button>
            </div>

            <div class="sidebar-scroll-body">
                <div id="tab-tiles"    class="tab-pane p-3 space-y-2.5"></div>
                <div id="tab-topo"     class="tab-pane hidden p-3 space-y-2.5"></div>
                <div id="tab-pq"       class="tab-pane hidden p-3 space-y-2.5"></div>
                <div id="tab-elastica" class="tab-pane hidden p-3 space-y-2.5"></div>
                <div id="tab-fdm"      class="tab-pane hidden p-3 space-y-2.5"></div>
                <div id="tab-fea"      class="tab-pane hidden p-3 space-y-2.5"></div>
                <div id="tab-io"       class="tab-pane hidden p-3 space-y-2.5"></div>
            </div>
        </div>

        <div id="sidebar-resize-e" class="sidebar-resize-handle-e" title="Drag to resize panel width"></div>
        <div id="sidebar-resize-se" class="sidebar-resize-handle-se" title="Drag to resize panel width &amp; height"></div>
    </aside>

    <!-- =====================================================================
         2. FLOATING ANALYTICAL TELEMETRY HUD PANEL (ui/display/telemetry_hud.js)
         ===================================================================== -->
    <aside id="telemetry-panel" class="floating-panel floating-telemetry minimized">
        <div id="telemetry-drag-header" class="panel-header" title="Drag to reposition panel">
            <div class="panel-title-group">
                <span class="panel-grip">⠿</span>
                <span class="panel-title">TOPOGEN-PQ-FDM-FEA Telemetry</span>
                <span class="panel-tag text-cyan-600">HUD</span>
                <span id="telemetry-hud-pill" class="panel-pill">Idle</span>
            </div>
            <div class="panel-actions">
                <button id="btn-telemetry-minimize" class="panel-btn panel-toggle-btn" title="Minimize / Expand Telemetry HUD">+</button>
            </div>
        </div>
        <div id="telemetry-collapsible" class="sidebar-scroll-body hidden p-3 space-y-2.5 text-[10px] font-mono"></div>
        <div id="telemetry-resize-e" class="sidebar-resize-handle-e hidden" title="Drag to resize telemetry panel width"></div>
        <div id="telemetry-resize-se" class="sidebar-resize-handle-se hidden" title="Drag to resize telemetry panel width &amp; height"></div>
    </aside>

    <!-- =====================================================================
         3. FLOATING VIEWPORT DISPLAY HUD PANEL (ui/display/display_hud.js)
         ===================================================================== -->
    <aside id="display-hud-panel" class="floating-panel floating-display-hud minimized">
        <div id="display-hud-drag-header" class="panel-header" title="Drag to reposition panel">
            <div class="panel-title-group">
                <span class="panel-grip">⠿</span>
                <span class="panel-title">Viewport Display</span>
                <span class="panel-tag text-pink-600">HUD</span>
            </div>
            <div class="panel-actions">
                <button id="btn-display-hud-minimize" class="panel-btn panel-toggle-btn" title="Minimize / Expand Viewport Display HUD">+</button>
            </div>
        </div>

        <div id="display-hud-collapsible" class="hidden p-3 space-y-2.5 text-[10px]">
            <div class="grid grid-cols-2 gap-1.5 font-sans text-[10px]">
                <label class="flex items-center space-x-1.5 cursor-pointer text-red-300 font-medium">
                    <input type="checkbox" id="chk-show-graph" checked class="accent-red-500 rounded">
                    <span>Centerline Graph</span>
                </label>
                <label class="flex items-center space-x-1.5 cursor-pointer text-gray-300">
                    <input type="checkbox" id="chk-show-meshes" checked class="accent-pink-500 rounded">
                    <span>Quad Meshes</span>
                </label>
                <label class="flex items-center space-x-1.5 cursor-pointer text-gray-300">
                    <input type="checkbox" id="chk-inactive-grid" checked class="accent-pink-500 rounded">
                    <span>Inactive Voxels</span>
                </label>
                <label class="flex items-center space-x-1.5 cursor-pointer text-gray-300">
                    <input type="checkbox" id="chk-superposition" checked class="accent-pink-500 rounded">
                    <span>Superposition</span>
                </label>
                <label class="flex items-center space-x-1.5 cursor-pointer text-amber-300 font-medium col-span-2 pt-0.5">
                    <input type="checkbox" id="chk-bounding-box" checked class="accent-amber-400 rounded">
                    <span>Bounding Box (W×D×H m)</span>
                </label>
            </div>
            <div class="space-y-1.5 pt-1.5 border-t border-gray-800 text-[10px]">
                <div class="flex items-center space-x-2">
                    <span class="text-gray-300 w-16 shrink-0 font-medium">Node Size</span>
                    <input id="rng-disp-node-size" type="range" min="0.2" max="3.0" step="0.1" value="1.0" class="flex-1 h-1.5 accent-pink-500 cursor-pointer" title="Scale 3D node markers">
                    <span id="val-disp-node-size" class="font-mono text-[9px] text-gray-300 w-10 text-right shrink-0">1.0×</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-gray-300 w-16 shrink-0 font-medium">Edge Size</span>
                    <input id="rng-disp-edge-size" type="range" min="0.5" max="6.0" step="0.25" value="1.5" class="flex-1 h-1.5 accent-sky-400 cursor-pointer" title="Line thickness of graph, FDM, and Elastica edges (px)">
                    <span id="val-disp-edge-size" class="font-mono text-[9px] text-gray-300 w-10 text-right shrink-0">1.5px</span>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-1 pt-1.5 border-t border-gray-800 font-sans">
                <button id="btn-wireframe" class="cad-btn py-1">Wireframe</button>
                <button id="btn-zoom" class="cad-btn py-1">Zoom Fit</button>
                <button id="btn-arctic" class="cad-btn py-1">Arctic</button>
            </div>
        </div>

        <div id="display-hud-resize-e" class="sidebar-resize-handle-e hidden" title="Drag to resize display HUD width"></div>
        <div id="display-hud-resize-se" class="sidebar-resize-handle-se hidden" title="Drag to resize display HUD width &amp; height"></div>
    </aside>

    <!-- =====================================================================
         4. FULL-BLEED 3D Z-UP VIEWPORT & OUTLINER (ui/display/viewport_scene.js)
         ===================================================================== -->
    <main id="canvas-container" class="flex-grow relative">
        <canvas id="overlay-canvas"></canvas>

        <!-- Studio-Light Live Connection & Conversation Pairing HUD (hidden on static servers) -->
        <div id="mcp-bridge-hud" class="mcp-bridge-hud hidden">
            <button type="button" id="mcp-bridge-pill" class="mcp-bridge-pill" aria-expanded="false" title="Live Connection — View browser pairing, mode, and tab controls.">
                <span id="mcp-bridge-dot" class="mcp-bridge-dot dot-unpaired"></span>
                <span id="mcp-bridge-label" class="mcp-bridge-label">Chrome · Unpaired</span>
                <span id="mcp-bridge-mode" class="mcp-bridge-mode mode-a">MODE A</span>
            </button>
            <div id="mcp-bridge-flash" class="mcp-bridge-flash hidden" aria-live="polite"></div>
            <div id="mcp-bridge-popover" class="mcp-bridge-popover hidden" role="dialog" aria-label="Browser Connection and Pairing">
                <div class="mcp-pop-header">
                    <span id="mcp-bridge-surface-label" class="mcp-pop-title">Chrome · 3D Workbench</span>
                    <span id="mcp-bridge-state-tag" class="mcp-state-tag unpaired">Unpaired</span>
                </div>
                <div class="mcp-pop-row">
                    <span class="mcp-pop-key">Tab ID</span>
                    <code id="mcp-bridge-tab-id" class="mcp-pop-code">wb_…</code>
                    <button type="button" id="btn-mcp-copy-tab" class="cad-btn mcp-pop-btn" title="Copy Tab ID — Share exact browser tab identifier.">Copy Tab ID</button>
                </div>
                <div class="mcp-pop-section">
                    <label for="inp-mcp-conv-id" class="mcp-pop-key">Conversation</label>
                    <input id="inp-mcp-conv-id" type="text" class="mcp-pop-input" placeholder="Paste Conversation ID" autocomplete="off" spellcheck="false" title="Conversation Pairing — Enter active session ID to pair this tab.">
                    <div class="mcp-pop-actions">
                        <button type="button" id="btn-mcp-pair-tab" class="cad-btn primary mcp-pop-btn flex-1" title="Pair This Tab — Lock workspace updates to this conversation.">Pair This Tab</button>
                        <button type="button" id="btn-mcp-unpair-tab" class="cad-btn mcp-pop-btn hidden" title="Unpair Tab — Clear active conversation link for this tab.">Unpair</button>
                    </div>
                    <div id="mcp-bridge-claim-msg" class="mcp-claim-msg hidden"></div>
                </div>
                <div class="mcp-pop-footer">
                    <a id="lnk-mcp-open-launcher" href="./foundry_launcher.html" target="_blank" rel="noopener" class="cad-btn cyan mcp-pop-link" title="Foundry Launcher — Open campaign sweep with same pairing.">Foundry Launcher ↗</a>
                </div>
            </div>
        </div>

        <aside id="outliner" class="floating-panel floating-outliner minimized text-[11px]">
            <div id="outliner-drag-header" class="panel-header" title="Drag to reposition panel">
                <div class="panel-title-group">
                    <span class="panel-grip">⠿</span>
                    <span class="panel-title">Outliner</span>
                    <span class="panel-tag text-emerald-600">SCENE</span>
                </div>
                <div class="panel-actions">
                    <button id="outliner-collapse" class="panel-btn panel-toggle-btn" title="Minimize / Expand Outliner">+</button>
                </div>
            </div>
            <div id="outliner-body" class="sidebar-scroll-body hidden flex flex-col min-h-0">
                <div class="flex space-x-1 p-1.5 border-b border-gray-700">
                    <button data-gizmo="off"       class="gizbtn cad-btn flex-1 seg-on" title="Select only">Sel</button>
                    <button data-gizmo="translate" class="gizbtn cad-btn flex-1" title="Move selected curve">Mv</button>
                    <button data-gizmo="rotate"    class="gizbtn cad-btn flex-1" title="Rotate selected curve">Rot</button>
                    <button data-gizmo="scale"     class="gizbtn cad-btn flex-1" title="Scale selected curve">Scl</button>
                    <button data-gizmo="cv"        class="gizbtn cad-btn flex-1" title="Edit control points">CV</button>
                </div>
                <div id="outliner-tree" class="overflow-y-auto p-1 flex-1 min-h-0"></div>
                <div id="outliner-footer" class="px-2 py-1 border-t border-gray-700 text-[9.5px] text-gray-500 font-mono">units: m · voxel 1 m · 3×3×4</div>
            </div>
            <div id="outliner-resize-e" class="sidebar-resize-handle-e hidden" title="Drag to resize outliner width"></div>
            <div id="outliner-resize-se" class="sidebar-resize-handle-se hidden" title="Drag to resize outliner width &amp; height"></div>
        </aside>

        <div id="loading-overlay" class="absolute inset-0 bg-white/80 flex items-center justify-center z-30 hidden">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-gray-800"></div>
        </div>
    </main>

    <!-- Modular Workbench Entrypoint (ES Modules — Zero Build Step) -->
    <script type="module" src="./ui/main.js"></script>
</body>
</html>
